<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<style>
  body { margin: 0; }
  * { box-sizing: border-box; }
  a { color: #0A84FF; text-decoration: none; }
  a:hover { color: #0A84FF; opacity: 0.8; }
  @keyframes discoDotPulse { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  @keyframes discoPopIn { from { opacity: 0; transform: translateY(6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
</style>
</helmet>
<div style="width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#e7e7ea;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;padding:40px;">
  <div style="width:1080px;height:700px;border-radius:12px;overflow:hidden;background:#ffffff;box-shadow:0 1px 0 rgba(0,0,0,0.06), 0 30px 60px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.06);display:flex;flex-direction:column;position:relative;">
    <div style="height:52px;flex-shrink:0;display:flex;align-items:center;border-bottom:1px solid rgba(0,0,0,0.08);background:#F7F7F8;">
      <div style="width:200px;flex-shrink:0;height:100%;display:flex;align-items:center;gap:8px;padding-left:20px;border-right:1px solid rgba(0,0,0,0.08);box-sizing:border-box;">
        <div style="width:12px;height:12px;border-radius:50%;background:#FF5F57;"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;"></div>
        <div style="width:12px;height:12px;border-radius:50%;background:#28C840;"></div>
      </div>
      <div style="flex:1;display:flex;align-items:center;gap:10px;padding:0 16px;min-width:0;">
        <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" onClick="{{ toggleLeftSidebar }}" style-hover="background:rgba(0,0,0,0.06);">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none"><rect x="1" y="1" width="14" height="12" rx="2.5" stroke="#6e6e73" stroke-width="1.3"></rect><line x1="5.5" y1="1.3" x2="5.5" y2="12.7" stroke="#6e6e73" stroke-width="1.3"></line><rect x="1.8" y="1.8" width="3" height="10.4" rx="1" fill="#6e6e73" fill-opacity="0.55"></rect></svg>
        </div>
        <div style="font-size:15px;font-weight:600;color:#1d1d1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ roomName }}</div>
        <div style="flex:1;"></div>
        <dc-import name="SegmentedControl" value="{{ engine }}" on-change="{{ setEngine }}" hint-size="170px,32px"></dc-import>
        <div style="width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;" onClick="{{ toggleRightSidebar }}" style-hover="background:rgba(0,0,0,0.06);">
          <svg width="16" height="14" viewBox="0 0 16 14" fill="none"><rect x="1" y="1" width="14" height="12" rx="2.5" stroke="#6e6e73" stroke-width="1.3"></rect><line x1="10.5" y1="1.3" x2="10.5" y2="12.7" stroke="#6e6e73" stroke-width="1.3"></line><rect x="11.2" y="1.8" width="3" height="10.4" rx="1" fill="#6e6e73" fill-opacity="0.55"></rect></svg>
        </div>
      </div>
      <div style="width:{{ headerRightWidth }};flex-shrink:0;height:100%;padding-left:{{ headerRightPadding }};box-sizing:border-box;border-left:{{ headerRightBorder }};display:flex;align-items:center;overflow:hidden;white-space:nowrap;transition:width 0.2s ease;">
        <span style="font-size:13px;font-weight:600;color:#6e6e73;">단어장</span>
      </div>
    </div>
    <div style="flex:1;display:flex;min-height:0;position:relative;">
      <div style="width:{{ leftSidebarWidth }};flex-shrink:0;overflow:hidden;background:#F5F5F7;border-right:{{ leftSidebarBorder }};display:flex;flex-direction:column;min-height:0;transition:width 0.2s ease;">
        <div style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px;">
          <sc-for list="{{ roomRows }}" as="room" hint-placeholder-count="4">
            <div style="display:flex;align-items:center;gap:8px;padding:{{ room.rowPad }};border-radius:7px;cursor:pointer;background:{{ room.rowBg }};" onClick="{{ room.onSelect }}" onMouseEnter="{{ room.onHoverIn }}" onMouseLeave="{{ room.onHoverOut }}">
              <span style="font-size:13px;color:{{ room.nameColor }};font-weight:{{ room.nameWeight }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;">{{ room.name }}</span>
              <div style="width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:{{ room.deleteIdleBg }};opacity:{{ room.deleteOpacity }};pointer-events:{{ room.deletePointerEvents }};" onClick="{{ room.onDelete }}" style-hover="background:{{ room.deleteHoverBg }};">
                <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6.5 4V2.5a1 1 0 011-1h1a1 1 0 011 1V4M3.5 4l.6 9a1 1 0 001 .9h5.8a1 1 0 001-.9l.6-9" stroke="{{ room.deleteIconColor }}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="position:relative;flex-shrink:0;border-top:1px solid rgba(0,0,0,0.08);">
          <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;" onClick="{{ openCreateRoom }}" style-hover="background:rgba(0,0,0,0.04);">
            <div style="width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#a1a1a6" stroke-width="1.3"></circle><path d="M8 5v6M5 8h6" stroke="#a1a1a6" stroke-width="1.3" stroke-linecap="round"></path></svg>
            </div>
            <span style="font-size:12.5px;color:#a1a1a6;font-weight:500;">새 테마</span>
          </div>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0;background:#ffffff;">
        <div ref="{{ messagesRef }}" style="flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:0;">
          <sc-for list="{{ messages }}" as="msg" hint-placeholder-count="4">
            <div style="display:flex;justify-content:{{ msg.justify }};">
              <div style="max-width:70%;padding:{{ msg.bubblePad }};border-radius:{{ msg.bubbleRadius }};background:{{ msg.bubbleBg }};color:{{ msg.bubbleColor }};font-size:14px;line-height:1.4;word-break:break-word;">{{ msg.text }}</div>
            </div>
          </sc-for>
          <sc-if value="{{ isTranslating }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;justify-content:flex-start;">
              <div style="padding:11px 16px;border-radius:15px 15px 15px 4px;background:#F0F0F2;display:flex;gap:4px;align-items:center;">
                <span style="width:6px;height:6px;border-radius:50%;background:#9a9aa0;display:inline-block;animation:discoDotPulse 1.1s infinite;"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:#9a9aa0;display:inline-block;animation:discoDotPulse 1.1s infinite 0.15s;"></span>
                <span style="width:6px;height:6px;border-radius:50%;background:#9a9aa0;display:inline-block;animation:discoDotPulse 1.1s infinite 0.3s;"></span>
              </div>
            </div>
          </sc-if>
        </div>
        <div style="flex-shrink:0;border-top:1px solid rgba(0,0,0,0.08);padding:12px 16px;display:flex;gap:10px;align-items:center;">
          <input type="text" value="{{ input }}" onChange="{{ onInputChange }}" onKeyDown="{{ onInputKeyDown }}" placeholder="번역할 텍스트 입력" style="flex:1;border:1px solid rgba(0,0,0,0.12);border-radius:9px;padding:10px 13px;font-size:14px;font-family:inherit;outline:none;background:#F5F5F7;color:#1d1d1f;" style-focus="border-color:{{ accent }};background:#ffffff;">
          <div style="width:34px;height:34px;border-radius:50%;background:{{ accent }};display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;opacity:{{ sendOpacity }};" onClick="{{ sendMessage }}">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          </div>
        </div>
      </div>
      <div style="width:{{ rightSidebarWidth }};flex-shrink:0;overflow:hidden;background:#FAFAFA;border-left:{{ rightSidebarBorder }};display:flex;flex-direction:column;min-height:0;transition:width 0.2s ease;">
        <sc-if value="{{ hasVocab }}" hint-placeholder-val="{{ true }}">
          <div style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px;">
            <sc-for list="{{ vocabRows }}" as="v" hint-placeholder-count="3">
              <div style="position:relative;" onMouseEnter="{{ v.onHoverIn }}" onMouseLeave="{{ v.onHoverOut }}">
                <div style="perspective:700px;">
                  <div style="position:relative;height:34px;cursor:pointer;transform-style:preserve-3d;transition:transform 0.45s cubic-bezier(0.4,0.2,0.2,1);transform:{{ v.flipTransform }};" onClick="{{ v.onFlip }}">
                    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;background:{{ v.frontBg }};box-shadow:0 0 0 1px rgba(0,0,0,0.07);display:flex;align-items:center;justify-content:center;padding:2px 8px;text-align:center;">
                      <span style="font-size:12.5px;font-weight:600;color:#1d1d1f;">{{ v.word }}</span>
                    </div>
                    <div style="position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;background:{{ accent }};transform:rotateY(180deg);display:flex;align-items:center;justify-content:center;padding:2px 8px;text-align:center;">
                      <span style="font-size:12px;font-weight:600;color:#ffffff;">{{ v.sub }}</span>
                    </div>
                  </div>
                </div>
                <sc-if value="{{ v.showDelete }}" hint-placeholder-val="{{ false }}">
                  <div style="position:absolute;top:50%;right:6px;transform:translateY(-50%);width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,0.85);box-shadow:0 0 0 1px rgba(0,0,0,0.06);" onClick="{{ v.onDelete }}" style-hover="background:#ffffff;">
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M6.5 4V2.5a1 1 0 011-1h1a1 1 0 011 1V4M3.5 4l.6 9a1 1 0 001 .9h5.8a1 1 0 001-.9l.6-9" stroke="#9a9aa0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ vocabEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 4a2 2 0 012-2h6a2 2 0 012 2v16l-5-3.2L7 20V4z" stroke="#c9c9ce" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"></path></svg>
            <div style="display:flex;flex-direction:column;gap:6px;">
              <span style="font-size:13px;font-weight:700;color:#3a3a3c;">아직 저장된 단어가 없어요</span>
              <span style="font-size:11px;color:#9a9aa0;line-height:1.5;">채팅에서 번역한 단어가<br/>자동으로 여기 쌓여요</span>
            </div>
          </div>
        </sc-if>
      </div>
      <sc-if value="{{ createRoomOpen }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;inset:0;background:rgba(0,0,0,0.22);z-index:50;display:flex;align-items:center;justify-content:center;" onClick="{{ closeCreateRoom }}">
          <div style="width:320px;background:#ffffff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,0.35);overflow:hidden;animation:discoPopIn 0.15s ease-out;" onClick="{{ stopClick }}">
            <div style="padding:14px 18px;border-bottom:1px solid rgba(0,0,0,0.08);">
              <span style="font-size:14.5px;font-weight:700;color:#1d1d1f;">새 테마 만들기</span>
            </div>
            <div style="padding:16px 18px;display:flex;flex-direction:column;gap:14px;">
              <div>
                <label style="display:block;font-size:12px;font-weight:600;color:#6e6e73;margin-bottom:6px;">테마 이름</label>
                <input ref="{{ createRoomNameRef }}" type="text" value="{{ createRoomName }}" onChange="{{ onCreateRoomNameChange }}" onKeyDown="{{ onCreateRoomNameKeyDown }}" placeholder="예: 여행, 운동, 요리" style="width:100%;height:36px;border:1px solid rgba(0,0,0,0.14);border-radius:8px;padding:0 11px;font-size:13px;font-family:inherit;outline:none;background:#F7F7F8;color:#1d1d1f;" style-focus="border-color:{{ accent }};background:#ffffff;"/>
              </div>
              <div>
                <label style="display:block;font-size:12px;font-weight:600;color:#6e6e73;margin-bottom:6px;">번역 언어</label>
                <div style="display:flex;flex-direction:column;gap:1px;background:#F7F7F8;border-radius:8px;padding:4px;">
                  <sc-for list="{{ createRoomLangOptions }}" as="lang" hint-placeholder-count="5">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:6px;cursor:pointer;background:{{ lang.bg }};" onClick="{{ lang.onPick }}">
                      <span style="font-size:12.5px;color:#1d1d1f;">{{ lang.name }}</span>
                      <sc-if value="{{ lang.selected }}" hint-placeholder-val="{{ false }}">
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l2.5 2.5L10 3" stroke="{{ accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                      </sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </div>
            <div style="padding:12px 16px;border-top:1px solid rgba(0,0,0,0.08);display:flex;justify-content:flex-end;gap:8px;">
              <button type="button" onClick="{{ closeCreateRoom }}" style="height:32px;padding:0 14px;border-radius:7px;background:none;border:1px solid rgba(0,0,0,0.14);color:#3a3a3c;font-size:12.5px;font-weight:600;cursor:pointer;">취소</button>
              <button type="button" onClick="{{ submitCreateRoom }}" style="height:32px;padding:0 14px;border-radius:7px;background:{{ accent }};border:none;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;">만들기</button>
            </div>
          </div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;blue&quot;, &quot;options&quot;: [&quot;blue&quot;,&quot;purple&quot;,&quot;pink&quot;,&quot;red&quot;,&quot;orange&quot;,&quot;yellow&quot;,&quot;green&quot;,&quot;graphite&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Appearance&quot;}, &quot;density&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;comfortable&quot;, &quot;options&quot;: [&quot;comfortable&quot;,&quot;compact&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Appearance&quot;}}">

    중국어: [{src:'안녕하세요',tgt:'你好'},{src:'감사합니다',tgt:'谢谢'},{src:'좋아요',tgt:'好的'},{src:'맛있어요',tgt:'好吃'}],

  };

  messagesRef = React.createRef();
  createRoomNameRef = React.createRef();

  state = {

    engine: 'general',
    input: '',

    createRoomOpen: false,
    createRoomName: '',

        ],
        messages: [
          {id:'p-u1', role:'user', text:'버그'},
          {id:'p-b1', role:'bot', text:'bug'},
          {id:'p-u2', role:'user', text:'배포'},

      {

        vocab: [
          {id:'b-v4', word:'touch base', sub:'연락하다', isNew:false},
          {id:'b-v3', word:'meeting', sub:'회의', isNew:false},
          {id:'b-v2', word:'budget', sub:'예산', isNew:false},
          {id:'b-v1', word:'deadline', sub:'마감일', isNew:false},
        ],
      },
    ],
  };

  componentDidMount() {
    this._onKeyDown = (e) => {
      if (e.key === 'Escape' && this.state.createRoomOpen) this.setState({ createRoomOpen:false });
    };
    document.addEventListener('keydown', this._onKeyDown);
  }
  componentWillUnmount() {
    document.removeEventListener('keydown', this._onKeyDown);
  }
  componentDidUpdate(prevProps, prevState) {
    const active = this.getActiveRoom();
    const prevActive = prevState.rooms.find(r => r.id === prevState.activeRoomId) || prevState.rooms[0];
    if (this.messagesRef.current && (prevActive.messages.length !== active.messages.length || prevState.activeRoomId !== this.state.activeRoomId || prevState.isTranslating !== this.state.isTranslating)) {
      this.messagesRef.current.scrollTop = this.messagesRef.current.scrollHeight;
    }
  }

  accentHex() { return this.accentMap[this.props.accentColor ?? 'blue'] || '#0A84FF'; }
  getActiveRoom() { return this.state.rooms.find(r => r.id === this.state.activeRoomId) || this.state.rooms[0]; }
  updateRoom(id, fn) { this.setState(s => ({ rooms: s.rooms.map(r => r.id === id ? fn(r) : r) })); }
  hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }

  translateFor(room, textRaw) {
    const text = (textRaw || '').trim();
    const dict = room.phrasebook;
    const hit = dict.find(p => text.length && (text.includes(p.src) || p.src.includes(text)));
    if (hit) return { tgt: hit.tgt, pron: hit.pron, src: hit.src };
    const pick = dict[this.hashStr(text || 'x') % dict.length];
    return { tgt: pick.tgt, pron: pick.pron, src: text.length ? text : pick.src };
  }

  selectRoom = (id) => { this.setState({ activeRoomId: id }); };
  setHoveredRoom = (id) => this.setState({ hoveredRoomId: id });
  setHoveredVocab = (id) => this.setState({ hoveredVocabId: id });
  deleteRoom(id) {
    if (this.state.rooms.length <= 1) return;
    this.setState(s => {
      const rooms = s.rooms.filter(r => r.id !== id);
      const activeRoomId = s.activeRoomId === id ? rooms[0].id : s.activeRoomId;
      return { rooms, activeRoomId, hoveredRoomId: null };
    });
  }
  deleteVocab(id) {
    const roomId = this.state.activeRoomId;
    this.updateRoom(roomId, r => ({ ...r, vocab: r.vocab.filter(v => v.id !== id) }));
    this.setState(s => {
      const flippedVocab = { ...s.flippedVocab }; delete flippedVocab[id];
      return { flippedVocab, hoveredVocabId: null };
    });
  }
  setEngine = (v) => { this.setState({ engine: v }); };
  setInput = (v) => { this.setState({ input: v }); };

  sendMessage = () => {
    const text = this.state.input.trim();
    if (!text || this.state.isTranslating) return;
    const roomId = this.state.activeRoomId;
    this.updateRoom(roomId, r => ({ ...r, messages: [...r.messages, { id: 'u' + Date.now(), role:'user', text }] }));
    this.setState({ input:'', isTranslating:true });
    setTimeout(() => {
      const room = this.state.rooms.find(r => r.id === roomId);
      if (!room) return;
      const result = this.translateFor(room, text);
      const vid = 'v' + Date.now();
      this.updateRoom(roomId, r => ({
        ...r,
        messages: [...r.messages, { id:'b' + Date.now(), role:'bot', text: result.tgt }],
        vocab: [{ id:vid, word: result.tgt, sub: result.src, isNew:true }, ...r.vocab],
      }));
      this.setState({ isTranslating:false });
      setTimeout(() => {
        this.updateRoom(roomId, r => ({ ...r, vocab: r.vocab.map(v => v.id === vid ? { ...v, isNew:false } : v) }));
      }, 1500);
    }, 650);
  };

  handleInputKeyDown = (e) => { if (e.key === 'Enter') this.sendMessage(); };

  openCreateRoom = () => {
    this.setState({ createRoomOpen: true, createRoomName: '', createRoomLanguage: '영어' });
    requestAnimationFrame(() => this.createRoomNameRef.current && this.createRoomNameRef.current.focus());
  };
  closeCreateRoom = () => this.setState({ createRoomOpen: false });
  stopClick = (e) => e.stopPropagation();
  onCreateRoomNameChange = (e) => this.setState({ createRoomName: e.target.value });
  onCreateRoomNameKeyDown = (e) => { if (e.key === 'Enter') this.submitCreateRoom(); };
  pickCreateRoomLanguage = (lang) => this.setState({ createRoomLanguage: lang });
  submitCreateRoom = () => {
    const name = this.state.createRoomName.trim();
    if (!name) { this.createRoomNameRef.current && this.createRoomNameRef.current.focus(); return; }
    const id = 'custom-' + Date.now();
    const tint = this.TINT_PALETTE[this.state.rooms.length % this.TINT_PALETTE.length];
    const phrasebook = this.LANGUAGE_PHRASES[this.state.createRoomLanguage] || this.LANGUAGE_PHRASES.영어;
    const newRoom = { id, name, code: name.slice(0, 1), tint, phrasebook, messages: [], vocab: [] };
    this.setState(s => ({ rooms: [...s.rooms, newRoom], activeRoomId: id, createRoomOpen: false }));
  };
  toggleLeftSidebar = () => this.setState(s => ({ leftSidebarOpen: !s.leftSidebarOpen }));
  toggleRightSidebar = () => this.setState(s => ({ rightSidebarOpen: !s.rightSidebarOpen }));
  toggleFlip(id) { this.setState(s => ({ flippedVocab: { ...s.flippedVocab, [id]: !s.flippedVocab[id] } })); }

  renderVals() {
    const accent = this.accentHex();
    const density = this.props.density === 'compact' ? 'compact' : 'comfortable';
    const active = this.getActiveRoom();
    const rowPadY = density === 'compact' ? 6 : 9;
    const bubblePad = density === 'compact' ? '7px 12px' : '9px 14px';

    const roomRows = this.state.rooms.map(r => {
      const isActive = r.id === active.id;
      return {
        id: r.id, name: r.name, code: r.code,
        rowBg: isActive ? accent : '#F5F5F7',
        rowPad: rowPadY + 'px 12px',
        nameColor: isActive ? '#ffffff' : '#1d1d1f',
        nameWeight: isActive ? 600 : 500,
        avatarBg: isActive ? 'rgba(255,255,255,0.28)' : r.tint,
        avatarColor: '#ffffff',
        onSelect: () => this.selectRoom(r.id),
        onHoverIn: () => this.setHoveredRoom(r.id),
        onHoverOut: () => this.setHoveredRoom(null),
        deleteOpacity: this.state.hoveredRoomId === r.id ? 1 : 0,
        deletePointerEvents: this.state.hoveredRoomId === r.id ? 'auto' : 'none',
        deleteIconColor: isActive ? 'rgba(255,255,255,0.8)' : '#9a9aa0',
        deleteIdleBg: 'transparent',
        deleteHoverBg: isActive ? 'rgba(255,255,255,0.22)' : 'rgba(0,0,0,0.08)',
        onDelete: (e) => { e.stopPropagation(); this.deleteRoom(r.id); },
      };
    });

    const messages = active.messages.map(m => {
      const isUser = m.role === 'user';
      return {
        id: m.id, text: m.text,
        justify: isUser ? 'flex-end' : 'flex-start',
        bubbleBg: isUser ? accent : '#F0F0F2',
        bubbleColor: isUser ? '#ffffff' : '#1d1d1f',
        bubbleRadius: isUser ? '15px 15px 4px 15px' : '15px 15px 15px 4px',
        bubblePad,
      };
    });

    const vocabRows = active.vocab.map(v => ({
      id: v.id, word: v.word, sub: v.sub,
      frontBg: v.isNew ? accent + '1c' : '#ffffff',
      flipTransform: this.state.flippedVocab[v.id] ? 'rotateY(180deg)' : 'rotateY(0deg)',
      onFlip: () => this.toggleFlip(v.id),
      onHoverIn: () => this.setHoveredVocab(v.id),
      onHoverOut: () => this.setHoveredVocab(null),
      showDelete: this.state.hoveredVocabId === v.id,
      onDelete: (e) => { e.stopPropagation(); this.deleteVocab(v.id); },
    }));

    return {
      accent,
      roomName: active.name,
      roomRows,
      messages,
      isTranslating: this.state.isTranslating,
      messagesRef: this.messagesRef,
      vocabRows,
      hasVocab: active.vocab.length > 0,
      vocabEmpty: active.vocab.length === 0,
      input: this.state.input,
      onInputChange: (e) => this.setInput(e.target.value),
      onInputKeyDown: this.handleInputKeyDown,
      sendMessage: this.sendMessage,
      sendOpacity: (this.state.input.trim().length > 0 && !this.state.isTranslating) ? 1 : 0.35,
      engine: this.state.engine,
      setEngine: this.setEngine,
      createRoomOpen: this.state.createRoomOpen,
      createRoomName: this.state.createRoomName,
      createRoomNameRef: this.createRoomNameRef,
      onCreateRoomNameChange: this.onCreateRoomNameChange,
      onCreateRoomNameKeyDown: this.onCreateRoomNameKeyDown,
      openCreateRoom: this.openCreateRoom,
      closeCreateRoom: this.closeCreateRoom,
      submitCreateRoom: this.submitCreateRoom,
      stopClick: this.stopClick,
      createRoomLangOptions: this.LANGUAGES.map(lang => ({
        name: lang,
        selected: lang === this.state.createRoomLanguage,
        bg: lang === this.state.createRoomLanguage ? 'rgba(0,0,0,0.05)' : 'transparent',
        onPick: () => this.pickCreateRoomLanguage(lang),
      })),
      leftSidebarOpen: this.state.leftSidebarOpen,
      rightSidebarOpen: this.state.rightSidebarOpen,
      leftSidebarWidth: this.state.leftSidebarOpen ? '200px' : '0px',
      leftSidebarBorder: this.state.leftSidebarOpen ? '1px solid rgba(0,0,0,0.08)' : 'none',
      rightSidebarWidth: this.state.rightSidebarOpen ? '200px' : '0px',
      rightSidebarBorder: this.state.rightSidebarOpen ? '1px solid rgba(0,0,0,0.08)' : 'none',
      headerRightWidth: this.state.rightSidebarOpen ? '200px' : '0px',
      headerRightBorder: this.state.rightSidebarOpen ? '1px solid rgba(0,0,0,0.08)' : 'none',
      headerRightPadding: this.state.rightSidebarOpen ? '16px' : '0px',
      toggleLeftSidebar: this.toggleLeftSidebar,
      toggleRightSidebar: this.toggleRightSidebar,
    };
  }
}
</script>
</body>
</html>
